<!doctype html>
<html>
   <head>
      <title>idle datastore tests</title>
      <style>
datastore-element {
   max-width: 500px;
   overflow-x: auto;
}

#datastores {
   display:   flex;
   flex-flow: row nowrap;
}
      </style>
   </head>
   <body>
      <script src="util.js"></script>
      <script src="datastore-nodes.js"></script>
      <script src="datastore.js"></script>
      <script src="testcases.js"></script>
      <script src="datastore-element.js"></script>
      
      <section>
         <label for="testcase">Testcase:</label>
         <select id="testcase"></select>
         <button id="set-testcase">View</button>
      </section>
      <section id="datastores">
         <datastore-element id="live"></datastore-element>
         <datastore-element id="verify"></datastore-element>
      </section>
      
      <script>
{
   let src = document.getElementById("live");
   let dst = document.getElementById("verify");
   dst.allow_editing = false;
   src.addEventListener("datastore-change", function(e) {
      dst.datastore = null;
      let data  = new Datastore();
      let forms = src.get_all_forms();
      data.build(forms.actions, forms.idles);
      dst.datastore = data;
   });
}
{
   let sel = document.getElementById("testcase");
   let btn = document.getElementById("set-testcase");
   for(let key in TESTCASES) {
      if (!TESTCASES.hasOwnProperty(key))
         continue;
      let opt = document.createElement("option");
      opt.value = key;
      opt.textContent = key;
      sel.append(opt);
   }
   btn.addEventListener("click", function() {
      document.getElementById("verify").datastore = null;
      let opt  = sel.selectedOptions[0];
      if (!opt)
         return;
      let elem = document.getElementById("live");
      let test = TESTCASES[opt.value].clone();
      let data = new Datastore();
      data.build(test.actions, test.idles);
      console.log(data);
      elem.datastore = data;
   });
}
      </script>
   </body>
</html>
