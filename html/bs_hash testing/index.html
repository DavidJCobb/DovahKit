<!doctype html>
<html>
   <head>
      <title>BSHash test</title>
      <style>
body{font-family:calibri,arial,sans-serif}
   #name{min-width:80ch}
   #out{font-family:"lucida console","courier new",monospace;width:32ch}
      </style>
   </head>
   <body>
      Name: <input type="text" id="name" /> <br/>
      Extension: <input type="text" id="ext" /> <input type="button" id="go" value="Go" /> <br/>
      Hash: <input type="text" id="out" readonly />
      <script>
function tolower(c) { // to-lower with default C locale
   c = c.charAt(0);
   if (("ABCDEFGHIJKLMNOPQRSTUVWXYZ").indexOf(c) >= 0)
      c = c.toLowerCase();
   else if (c == "/")
      c = "\\";
   return c;
}

function _hash_string(/*String*/ s, /*Number*/ length) {
   //length = length & 0xFF; // enforce uint8_t
   if (length <= 0)
      return 0;
   let result = 0;
   for(let i = 0; i < length; ++i) {
      result *= 0x1003F;
      result |= 0; // cheap hack to coerce from double to 32-bit
      result += tolower(s[i] || "\0").charCodeAt(0);
      result |= 0; // cheap hack to coerce from double to 32-bit
   }
   return result;
}

const _extensions = [ "", ".nif", ".kf", ".dds", ".wav" ];

document.getElementById("go").addEventListener("click", function(e) {

   const NEW_IMPL           = true;
   const NEW_IMPL_TRUNCATES = false;

   let name = document.getElementById("name").value;
   let ext  = document.getElementById("ext").value;
   //
   let hash = new ArrayBuffer(8);
   let view = new DataView(hash);
   //
   let length   = name.length; // includes null-terminator
   let length_b = length & 0xFF;
   view.setUint8(2, length);
   view.setUint8(3, tolower(name[0]).charCodeAt(0));
   if (NEW_IMPL) {
      if (length > 2) {
         view.setUint8(0, tolower(name[length - 1]).charCodeAt(0));
         view.setUint8(1, tolower(name[length - 2]).charCodeAt(0));
         if (length > 3) {
            if (NEW_IMPL_TRUNCATES) {
               name = name.substring(1);
               view.setUint32(4, _hash_string(name, length_b - 3), true);
            } else {
               name = name.substring(1, length - 2);
               view.setUint32(4, _hash_string(name, name.length), true);
            }
         }
      
      }
   } else {
      view.setUint8(0, tolower(name[length_b - 1] || "\0").charCodeAt(0));
      view.setUint8(1, (length_b > 2) ? tolower(name[length_b - 2]).charCodeAt(0) : 0);
      if (length_b > 3)
         view.setUint32(4, _hash_string(name.substring(1), length_b - 3), true);
   }
   //
   if (ext) {
      view.setUint32(4, view.getUint32(4, true) + _hash_string(ext, ext.length), true);
      for(let i = 0; i < _extensions.length; ++i) {
         if (_extensions[i] == ext.toLowerCase()) {
            view.setUint8(3, view.getUint8(3) + (((i & 0xFF) & ~3) << 5));
            view.setUint8(0, view.getUint8(0) + (((i & 0xFF) & ~1) << 6));
            view.setUint8(1, view.getUint8(1) + (((i & 0xFF)) << 7));
            break;
         }
      }
   }
   //
   let hash_to_string = "";
   for(let i = 0; i < 8; ++i) {
      let octet = view.getUint8(i).toString(16);
      if (octet.length == 1)
         octet = "0" + octet;
      hash_to_string += octet + " ";
   }
   document.getElementById("out").value = hash_to_string.toUpperCase();
});
      </script>
   </body>
</html>
