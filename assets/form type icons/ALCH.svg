<svg version="1.1" viewBox="0 0 100 100" width="64" height="64" xmlns="http://www.w3.org/2000/svg">
   <defs>
      <path id="bottle-shape"
         d="M 20 100 Q 0 100 0 80 L 0 60 Q 0 40 20 40 Q 40 40 40 30 L 40 20 L 32 20 L 32 0 L 68 0 L 68 20 L 60 20 L 60 30 Q 60 40 80 40 Q 100 40 100 60 L 100 80 Q 100 100 80 100 Z"
      />
      <mask id="clip">
         <rect x="0" y="0" width="100" height="100" fill="#000" />
         <use href="#bottle-shape" fill="#FFF" />
      </mask>
      
      <linearGradient id="neck-shadow-grad" x1="0" y1="0" x2="0" y2="1">
         <stop offset="  0%" stop-color="#00000060" />
         <stop offset="100%" stop-color="#0000" />
      </linearGradient>
      
      <linearGradient id="specular-grad" x1="0" y1="0" x2="1" y2="1">
         <stop offset=" 20%" stop-color="#FFF" />
         <stop offset="100%" stop-color="#0000" />
      </linearGradient>
   </defs>
   <g mask="url(#clip)">
      <use href="#bottle-shape" fill="#749" />
      <rect id="neck-shadow"
         fill="url(#neck-shadow-grad)"
         x="30"
         y="15"
         width="40"
         height="25"
      />
      <!--<rect id="label"
         fill="#E0B870"
         x="20"
         y="55"
         width="60"
         height="30"
      />-->
      <path id="specular-a"
         d="M 10 80 L 10 60 Q 10 50 20 50 L 25 50 Q 38 49 44 40 A 1 1 0 0 1 50 44 Q 32 61 29 80 A 1 1 0 0 1 10 80"
         fill="url(#specular-grad)"
         stroke="#FFF"
         stroke-width="0"
         stroke-linecap="round"
         transform="translate(0 0)"
      />
      <path id="shadow-a"
         d="M 91 80 Q 91 90 75 90 L 45 90 A 1 1 0 0 1 44 81 Q 67 81 85 66 Q 91 62 91 71 Z"
         fill="#00000030"
      />
      <use href="#bottle-shape" fill="none" stroke="#000" stroke-width="10" />
   </g>
</svg>